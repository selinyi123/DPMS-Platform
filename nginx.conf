
events { worker_connections 1024; }

http {

    include /etc/nginx/mime.types;
    # Authentication is header-only. Also omit every query string from access
    # logs so obsolete clients cannot persist a rejected credential in logs.
    log_format dpms '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log dpms;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {

        listen 80;

        location /api {

            set $core_api core-api:8000;

            proxy_pass http://$core_api;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            # Do not preserve a client-supplied chain. Core accepts this value
            # for the Weibo `rip` contract only when this proxy's peer address
            # is covered by WEIBO_TRUSTED_PROXY_CIDRS; local Compose can instead
            # use the explicit WEIBO_PUBLIC_RIP egress fallback.
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_set_header X-Forwarded-Proto $scheme;

            # Manual discovery remains a synchronous compatibility API while
            # its durable four-lane fan-out waits at most 135 seconds.  This
            # deliberately permits one longer-lived connection per coalesced
            # operator scan; Core singleflight prevents concurrent callers
            # from multiplying the underlying scan.
            proxy_read_timeout 150s;

            proxy_send_timeout 150s;

        }

        location /uploads { return 404; }

        location /releases { return 404; }

        # Dynamic-import chunk names change between releases. Force the HTML
        # module graph to revalidate so Vite's preload-error recovery cannot
        # reload an old index that still references deleted chunks.
        location = /index.html {

            root /usr/share/nginx/html;

            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        }

        location / {

            root /usr/share/nginx/html;

            try_files $uri /index.html;

            # Security headers for the dashboard SPA (Phase 4). API responses set
            # their own (stricter) headers in the core app. The SPA loads only
            # same-origin bundles and talks to same-origin /api; React applies
            # inline style attributes at runtime, so style-src needs unsafe-inline.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        }

    }

}
