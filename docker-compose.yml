x-storage-platform-init: &storage-platform-init
  image: alpine:3.20@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
  command:
    - sh
    - -ec
    - |
      umask 027
      platform="$${DPMS_PLATFORM_SCOPE}"
      profile_root="/profiles/$$platform"
      evidence_root="/evidence/$$platform"
      profile_marker="$$profile_root/.dpms-storage-permissions-v1"
      evidence_marker="$$evidence_root/.dpms-storage-permissions-v1"
      mkdir -p \
        "$$profile_root/account-calibrations" \
        "$$evidence_root/task-failures" \
        "$$evidence_root/shadow-runs" \
        "$$evidence_root/adapter-probes"
      if [ ! -f "$$profile_marker" ]; then
        chown -R 1000:2000 "$$profile_root"
        : > "$$profile_marker"
        chown 1000:2000 "$$profile_marker"
        chmod 0640 "$$profile_marker"
      fi
      if [ ! -f "$$evidence_marker" ]; then
        chown -R 1000:2000 "$$evidence_root"
        find "$$evidence_root" -type d -exec chmod 2750 {} \;
        : > "$$evidence_marker"
        chown 1000:2000 "$$evidence_marker"
        chmod 0640 "$$evidence_marker"
      fi
      chown 1000:2000 \
        "$$profile_root" \
        "$$profile_root/account-calibrations" \
        "$$evidence_root" \
        "$$evidence_root/task-failures" \
        "$$evidence_root/shadow-runs" \
        "$$evidence_root/adapter-probes"
      chmod 2750 "$$profile_root" "$$profile_root/account-calibrations"
      chmod 2750 \
        "$$evidence_root" \
        "$$evidence_root/task-failures" \
        "$$evidence_root/shadow-runs" \
        "$$evidence_root/adapter-probes"
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
  security_opt:
    - no-new-privileges:true
  restart: "no"

services:
  profiles-login-init:
    image: alpine:3.20@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
    command:
      - sh
      - -ec
      - |
        umask 027
        profile_root=/profiles/login-sessions
        permission_marker="$$profile_root/.dpms-storage-permissions-v1"
        mkdir -p "$$profile_root"
        if [ ! -f "$$permission_marker" ]; then
          chown -R 1000:2000 "$$profile_root"
          : > "$$permission_marker"
          chown 1000:2000 "$$permission_marker"
          chmod 0640 "$$permission_marker"
        fi
        chown 1000:2000 "$$profile_root"
        chmod 2750 "$$profile_root"
    volumes:
      - ./browser-profiles/login-sessions:/profiles/login-sessions
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  storage-bilibili-init:
    <<: *storage-platform-init
    environment:
      DPMS_PLATFORM_SCOPE: bilibili
    volumes:
      - ./browser-profiles/bilibili:/profiles/bilibili
      - evidence-bilibili:/evidence/bilibili

  storage-weibo-init:
    <<: *storage-platform-init
    environment:
      DPMS_PLATFORM_SCOPE: weibo
    volumes:
      - ./browser-profiles/weibo:/profiles/weibo
      - evidence-weibo:/evidence/weibo

  storage-xiaohongshu-init:
