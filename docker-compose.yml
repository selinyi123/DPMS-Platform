      dockerfile: docker/mysql/Dockerfile
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottery}
      MYSQL_RUNTIME_USER: ${MYSQL_RUNTIME_USER:-dpms_runtime}
      MYSQL_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:-dpms-runtime-local-only-change-me-2026}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-dpms_migrate}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-dpms-migrate-local-only-change-me-2026}
      MYSQL_RUNTIME_USER_BILIBILI: ${MYSQL_RUNTIME_USER_BILIBILI:-dpms_runtime_bilibili}
      MYSQL_RUNTIME_PASSWORD_BILIBILI: ${MYSQL_RUNTIME_PASSWORD_BILIBILI:-dpms-runtime-bilibili-local-only-change-me-2026}
      MYSQL_RUNTIME_USER_WEIBO: ${MYSQL_RUNTIME_USER_WEIBO:-dpms_runtime_weibo}
      MYSQL_RUNTIME_PASSWORD_WEIBO: ${MYSQL_RUNTIME_PASSWORD_WEIBO:-dpms-runtime-weibo-local-only-change-me-2026}
      MYSQL_RUNTIME_USER_XIAOHONGSHU: ${MYSQL_RUNTIME_USER_XIAOHONGSHU:-dpms_runtime_xiaohongshu}
      MYSQL_RUNTIME_PASSWORD_XIAOHONGSHU: ${MYSQL_RUNTIME_PASSWORD_XIAOHONGSHU:-dpms-runtime-xiaohongshu-local-only-change-me-2026}
      MYSQL_RUNTIME_USER_DOUYIN: ${MYSQL_RUNTIME_USER_DOUYIN:-dpms_runtime_douyin}
      MYSQL_RUNTIME_PASSWORD_DOUYIN: ${MYSQL_RUNTIME_PASSWORD_DOUYIN:-dpms-runtime-douyin-local-only-change-me-2026}
      # Shared mode falls back to MYSQL_DATABASE. Production isolated mode
      # must override all four values with distinct database names.
      MYSQL_DATABASE_BILIBILI: ${MYSQL_DATABASE_BILIBILI:-${MYSQL_DATABASE:-lottery}}
      MYSQL_DATABASE_WEIBO: ${MYSQL_DATABASE_WEIBO:-${MYSQL_DATABASE:-lottery}}
      MYSQL_DATABASE_XIAOHONGSHU: ${MYSQL_DATABASE_XIAOHONGSHU:-${MYSQL_DATABASE:-lottery}}
      MYSQL_DATABASE_DOUYIN: ${MYSQL_DATABASE_DOUYIN:-${MYSQL_DATABASE:-lottery}}
      DPMS_MYSQL_PLATFORM_DATABASE_MODE: ${DPMS_MYSQL_PLATFORM_DATABASE_MODE:-shared}
    networks:
      - app-net
    ports:
      - "127.0.0.1:3306:3306"
    # Health must not depend on a runtime role that is intentionally absent on
    # an existing volume until the explicit release-time provision step runs.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=socket -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1200M
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1

  redis:
    image: redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    entrypoint:
      - /bin/sh
      - /usr/local/bin/dpms-redis-entrypoint.sh
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-dev}
      REDIS_CORE_PASSWORD: ${REDIS_CORE_PASSWORD:-dpms-core-local-only-change-me-2026}
      REDIS_WORKER_PASSWORD: ${REDIS_WORKER_PASSWORD:-dpms-worker-local-only-change-me-2026}
      REDIS_CORE_BILIBILI_USERNAME: ${REDIS_CORE_BILIBILI_USERNAME:-core-bilibili}
      REDIS_WORKER_BILIBILI_USERNAME: ${REDIS_WORKER_BILIBILI_USERNAME:-worker-bilibili}
      REDIS_CORE_BILIBILI_PASSWORD: ${REDIS_CORE_BILIBILI_PASSWORD:-dpms-core-bilibili-local-only-change-me-2026}
      REDIS_WORKER_BILIBILI_PASSWORD: ${REDIS_WORKER_BILIBILI_PASSWORD:-dpms-worker-bilibili-local-only-change-me-2026}
      REDIS_CORE_WEIBO_USERNAME: ${REDIS_CORE_WEIBO_USERNAME:-core-weibo}
      REDIS_WORKER_WEIBO_USERNAME: ${REDIS_WORKER_WEIBO_USERNAME:-worker-weibo}
      REDIS_CORE_WEIBO_PASSWORD: ${REDIS_CORE_WEIBO_PASSWORD:-dpms-core-weibo-local-only-change-me-2026}
      REDIS_WORKER_WEIBO_PASSWORD: ${REDIS_WORKER_WEIBO_PASSWORD:-dpms-worker-weibo-local-only-change-me-2026}
      REDIS_CORE_XIAOHONGSHU_USERNAME: ${REDIS_CORE_XIAOHONGSHU_USERNAME:-core-xiaohongshu}
      REDIS_WORKER_XIAOHONGSHU_USERNAME: ${REDIS_WORKER_XIAOHONGSHU_USERNAME:-worker-xiaohongshu}
      REDIS_CORE_XIAOHONGSHU_PASSWORD: ${REDIS_CORE_XIAOHONGSHU_PASSWORD:-dpms-core-xiaohongshu-local-only-change-me-2026}
      REDIS_WORKER_XIAOHONGSHU_PASSWORD: ${REDIS_WORKER_XIAOHONGSHU_PASSWORD:-dpms-worker-xiaohongshu-local-only-change-me-2026}
      REDIS_CORE_DOUYIN_USERNAME: ${REDIS_CORE_DOUYIN_USERNAME:-core-douyin}
      REDIS_WORKER_DOUYIN_USERNAME: ${REDIS_WORKER_DOUYIN_USERNAME:-worker-douyin}
      REDIS_CORE_DOUYIN_PASSWORD: ${REDIS_CORE_DOUYIN_PASSWORD:-dpms-core-douyin-local-only-change-me-2026}
      REDIS_WORKER_DOUYIN_PASSWORD: ${REDIS_WORKER_DOUYIN_PASSWORD:-dpms-worker-douyin-local-only-change-me-2026}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:-dpms-health-local-only-change-me-2026}
      REDIS_GROUP_ADMIN_PASSWORD: ${REDIS_GROUP_ADMIN_PASSWORD:-dpms-group-admin-local-only-change-me-2026}
    volumes:
      - redis-data:/data
      - ./docker/redis/entrypoint.sh:/usr/local/bin/dpms-redis-entrypoint.sh:ro
      - ./docker/redis/consumer-groups.tsv:/usr/local/share/dpms/consumer-groups.tsv:ro
    networks:
      - app-net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(REDISCLI_AUTH=\"$${REDIS_HEALTH_PASSWORD}\" redis-cli --no-auth-warning --raw --user health ACL WHOAMI 2>/dev/null)\" = health && REDISCLI_AUTH=\"$${REDIS_HEALTH_PASSWORD}\" redis-cli --no-auth-warning --raw --user health PING 2>/dev/null | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  mysql-data:
  evidence-data:
  evidence-bilibili:
  evidence-weibo:
  evidence-xiaohongshu:
  evidence-douyin:
  redis-data:
