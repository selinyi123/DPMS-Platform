      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-dpms_migrate}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-dev}
      REAL_RUN_ENABLED: ${REAL_RUN_ENABLED:-false}
    networks:
