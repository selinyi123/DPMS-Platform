services:
  evidence-init:
    image: alpine:3.20
    command:
      - sh
      - -ec
      - |
        umask 077
        mkdir -p /evidence/task-failures /evidence/shadow-runs /evidence/adapter-probes
        chmod 0700 /evidence /evidence/task-failures /evidence/shadow-runs /evidence/adapter-probes
    volumes:
      - evidence-data:/evidence
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard/dist:/usr/share/nginx/html:ro
      - ./releases:/var/www/releases:ro
      - ./logs:/var/www/uploads:ro
    networks:
      - app-net
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  core-api:
    build:
      context: .
      dockerfile: core/Dockerfile
    volumes:
      - ./core/app:/app/app
      - ./releases:/app/releases
      - ./backups:/app/backups
      - ./browser-profiles:/profiles
      - evidence-data:/evidence:ro
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-lottery}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      EVIDENCE_ROOT: /evidence
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      evidence-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 2560M
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    volumes:
      - ./worker/app:/app/app
      - ./browser-profiles:/profiles
      - evidence-data:/evidence
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-lottery}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      EVIDENCE_ROOT: /evidence
    networks:
      - app-net
    depends_on:
      core-api:
        condition: service_healthy
      evidence-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sys, time; p='/tmp/worker-health'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    restart: unless-stopped
    shm_size: "1gb"
    # Chromium launches with --no-sandbox --disable-dev-shm-usage (see
    # worker/app/browser_pool.py) and shm_size above, so the broad SYS_ADMIN
    # capability is unnecessary. Dropping it and blocking privilege escalation
    # tightens the worker's blast radius (Phase 4). Validate browser launch in a
    # real container after this change.
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.0
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/001-bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lottery}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    networks:
      - app-net
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1200M
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1

  redis:
    image: redis:7-alpine
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  mysql-data:
  evidence-data:
