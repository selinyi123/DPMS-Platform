name: Regression

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/core:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.lock

      - name: Install the pinned Core dependencies
        run: python -m pip install --require-hashes --requirement core/requirements.lock

      - name: Run the full Core suite
        run: python -m unittest discover -s core/tests -p "test_*.py"

  worker:
    name: Worker unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/worker:${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.1"

      - name: Install the pinned Worker dependencies
        run: python -m pip install --require-hashes --requirement worker/requirements.lock

      - name: Run the full Worker suite
        run: python -m unittest discover -s worker/tests -p "test_*.py"

      - name: Verify Core, Worker, and frontend platform contract parity
        run: python scripts/platform_contract_parity.py --strict-target-kinds

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked frontend dependencies
        run: npm ci

      - name: Run the frontend suite
        run: npm test

      - name: Build the frontend
        run: npm run build

  container-contract:
    name: Container runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the static container runtime contract
        run: python scripts/container_runtime_smoke.py --skip-docker

      - name: Validate the Compose model
        run: docker compose -f docker-compose.yml config --quiet
