name: Real storage contracts

on:
  pull_request:
    paths:
      - ".github/workflows/real-contracts.yml"
      - "core/**"
      - "docker/mysql/**"
      - "docker/redis/**"
      - "docker-compose.yml"
      - "init.sql"
      - "scripts/prepare_contract_database.py"
      - "shared/**"
      - "worker/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/real-contracts.yml"
      - "core/**"
      - "docker/mysql/**"
      - "docker/redis/**"
      - "docker-compose.yml"
      - "init.sql"
      - "scripts/prepare_contract_database.py"
      - "shared/**"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-redis-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: contract-root-only
          MYSQL_DATABASE: dpms_contract_ci
          MYSQL_USER: contract
          MYSQL_PASSWORD: contract-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucontract -pcontract-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql+aiomysql://dpms_migrate:contract-migration-only@127.0.0.1:3306/dpms_contract_ci?charset=utf8mb4
      DPMS_CONTRACT_DATABASE_ADMIN_URL: mysql+aiomysql://root:contract-root-only@127.0.0.1:3306/mysql?charset=utf8mb4
      DPMS_RUNTIME_DATABASE_URL: mysql+aiomysql://dpms_runtime:contract-runtime-only@127.0.0.1:3306/dpms_contract_ci?charset=utf8mb4
      DPMS_MIGRATION_DATABASE_URL: mysql+aiomysql://dpms_migrate:contract-migration-only@127.0.0.1:3306/dpms_contract_ci?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/15
      DPMS_MYSQL_INTEGRATION: "1"
      DPMS_MYSQL_ROLE_INTEGRATION: "1"
      DPMS_REDIS_INTEGRATION: "1"
      DPMS_MANAGED_REDIS_ACL_INTEGRATION: "1"
      DPMS_MANAGED_REDIS_HOST: 127.0.0.1
      DPMS_MANAGED_REDIS_PORT: "6380"
      DPMS_MANAGED_REDIS_CORE_PASSWORD: core-contract-only-20260724
      DPMS_MANAGED_REDIS_WORKER_PASSWORD: worker-contract-only-20260724
      DPMS_MANAGED_REDIS_CORE_BILIBILI_PASSWORD: core-bilibili-contract-only-20260724
      DPMS_MANAGED_REDIS_WORKER_BILIBILI_PASSWORD: worker-bilibili-contract-only-20260724
      DPMS_MANAGED_REDIS_CORE_WEIBO_PASSWORD: core-weibo-contract-only-20260724
      DPMS_MANAGED_REDIS_WORKER_WEIBO_PASSWORD: worker-weibo-contract-only-20260724
      DPMS_MANAGED_REDIS_CORE_XIAOHONGSHU_PASSWORD: core-xiaohongshu-contract-only-20260724
      DPMS_MANAGED_REDIS_WORKER_XIAOHONGSHU_PASSWORD: worker-xiaohongshu-contract-only-20260724
      DPMS_MANAGED_REDIS_CORE_DOUYIN_PASSWORD: core-douyin-contract-only-20260724
      DPMS_MANAGED_REDIS_WORKER_DOUYIN_PASSWORD: worker-douyin-contract-only-20260724
      DPMS_MANAGED_REDIS_HEALTH_PASSWORD: health-contract-only-20260724
      DPMS_MANAGED_REDIS_GROUP_ADMIN_PASSWORD: group-admin-contract-only-20260724
      DPMS_CONTRACT_DATABASE_BOOTSTRAP: "1"
      MYSQL_ADMIN_HOST: 127.0.0.1
      MYSQL_ADMIN_PORT: "3306"
      MYSQL_ROOT_PASSWORD: contract-root-only
      MYSQL_DATABASE: dpms_contract_ci
      MYSQL_RUNTIME_USER: dpms_runtime
      MYSQL_RUNTIME_PASSWORD: contract-runtime-only
      MYSQL_MIGRATION_USER: dpms_migrate
      MYSQL_MIGRATION_PASSWORD: contract-migration-only
      PYTHONPATH: ${{ github.workspace }}/core:${{ github.workspace }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.lock

      - name: Install the pinned direct Core dependencies
        run: python -m pip install --require-hashes --requirement core/requirements.lock

      - name: Provision roles on an already initialized volume, idempotently
        run: |
          bash docker/mysql/provision-roles.sh
          bash docker/mysql/provision-roles.sh

      - name: Bootstrap and verify the disposable schema
        run: python scripts/prepare_contract_database.py

      - name: Start the managed Redis ACL image contract
        run: |
          docker run --detach --name dpms-contract-managed-redis \
            --publish 127.0.0.1:6380:6379 \
            --read-only \
            --tmpfs /data:rw,noexec,nosuid,size=64m \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --cap-add CHOWN \
            --cap-add SETGID \
            --cap-add SETUID \
            --env DEPLOYMENT_MODE=production \
            --env REDIS_CORE_PASSWORD="$DPMS_MANAGED_REDIS_CORE_PASSWORD" \
            --env REDIS_WORKER_PASSWORD="$DPMS_MANAGED_REDIS_WORKER_PASSWORD" \
            --env REDIS_CORE_BILIBILI_PASSWORD="$DPMS_MANAGED_REDIS_CORE_BILIBILI_PASSWORD" \
            --env REDIS_WORKER_BILIBILI_PASSWORD="$DPMS_MANAGED_REDIS_WORKER_BILIBILI_PASSWORD" \
            --env REDIS_CORE_WEIBO_PASSWORD="$DPMS_MANAGED_REDIS_CORE_WEIBO_PASSWORD" \
            --env REDIS_WORKER_WEIBO_PASSWORD="$DPMS_MANAGED_REDIS_WORKER_WEIBO_PASSWORD" \
            --env REDIS_CORE_XIAOHONGSHU_PASSWORD="$DPMS_MANAGED_REDIS_CORE_XIAOHONGSHU_PASSWORD" \
            --env REDIS_WORKER_XIAOHONGSHU_PASSWORD="$DPMS_MANAGED_REDIS_WORKER_XIAOHONGSHU_PASSWORD" \
            --env REDIS_CORE_DOUYIN_PASSWORD="$DPMS_MANAGED_REDIS_CORE_DOUYIN_PASSWORD" \
            --env REDIS_WORKER_DOUYIN_PASSWORD="$DPMS_MANAGED_REDIS_WORKER_DOUYIN_PASSWORD" \
            --env REDIS_HEALTH_PASSWORD="$DPMS_MANAGED_REDIS_HEALTH_PASSWORD" \
            --env REDIS_GROUP_ADMIN_PASSWORD="$DPMS_MANAGED_REDIS_GROUP_ADMIN_PASSWORD" \
            --volume "$GITHUB_WORKSPACE/docker/redis/entrypoint.sh:/usr/local/bin/dpms-redis-entrypoint.sh:ro" \
            --volume "$GITHUB_WORKSPACE/docker/redis/consumer-groups.tsv:/usr/local/share/dpms/consumer-groups.tsv:ro" \
            --entrypoint /bin/sh \
            redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99 \
            /usr/local/bin/dpms-redis-entrypoint.sh
          for attempt in $(seq 1 30); do
            if docker exec \
              --env REDISCLI_AUTH="$DPMS_MANAGED_REDIS_HEALTH_PASSWORD" \
              dpms-contract-managed-redis \
              redis-cli --user health ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs dpms-contract-managed-redis
          exit 1

      - name: Run real MySQL and Redis contracts
        run: >-
          python -m unittest -v
          core/tests/test_contract_database_bootstrap_safety.py
          core/tests/test_managed_redis_acl_integration.py
          core/tests/test_mysql_migration_contract.py
          core/tests/test_mysql_runtime_role_contract.py
          core/tests/test_redis_stream_retention_integration.py

      - name: Run the Worker exact migration-ledger startup gate
        env:
          DATABASE_URL: ${{ env.DPMS_RUNTIME_DATABASE_URL }}
          DPMS_MYSQL_WORKER_GATE_INTEGRATION: "1"
          PYTHONPATH: ${{ github.workspace }}/worker:${{ github.workspace }}
        run: >-
          python -m unittest -v
          worker/tests/test_mysql_schema_startup_gate_integration.py

      - name: Stop the managed Redis ACL contract
        if: always()
        run: docker rm --force dpms-contract-managed-redis || true
